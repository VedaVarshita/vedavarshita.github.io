<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace">
  <rect width="1200" height="630" fill="#151b23"/>

  <text x="40" y="55" font-size="24" letter-spacing="3" fill="#58a6ff" font-weight="700">AIR QUALITY TIME SERIES FORECASTING</text>

  <!-- Box 1 -->
  <rect x="40" y="85" width="1120" height="150" fill="none" stroke="#e6edf3" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-size="28" fill="#e6edf3" font-weight="700">Diagnostics</text>
  <line x1="60" y1="150" x2="1140" y2="150" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="600" y="200" text-anchor="middle" font-size="23" fill="#c9d1d9">Rolling stats  →  ADF stationarity test  →  ACF / PACF  →  differencing</text>

  <text x="600" y="268" text-anchor="middle" font-size="26" fill="#58a6ff">&#8595;</text>

  <!-- Box 2 -->
  <rect x="40" y="285" width="1120" height="110" fill="none" stroke="#e6edf3" stroke-width="2"/>
  <text x="600" y="325" text-anchor="middle" font-size="28" fill="#e6edf3" font-weight="700">Smoothing</text>
  <line x1="60" y1="345" x2="1140" y2="345" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="600" y="378" text-anchor="middle" font-size="23" fill="#c9d1d9">Moving averages  →  Exponential / Holt-Winters smoothing</text>

  <text x="600" y="428" text-anchor="middle" font-size="26" fill="#58a6ff">&#8595;</text>

  <!-- Box 3 -->
  <rect x="40" y="445" width="1120" height="140" fill="none" stroke="#e6edf3" stroke-width="2"/>
  <text x="600" y="485" text-anchor="middle" font-size="28" fill="#e6edf3" font-weight="700">Forecasting Models</text>
  <line x1="60" y1="505" x2="1140" y2="505" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="600" y="540" text-anchor="middle" font-size="23" fill="#c9d1d9">Naive baseline · ARIMA · SARIMA · Exponential state-space</text>
  <text x="600" y="568" text-anchor="middle" font-size="23" fill="#c9d1d9">~20–30% RMSE reduction vs. naive baseline</text>
</svg>
